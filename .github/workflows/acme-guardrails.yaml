name: Acme guardrails

on:
  pull_request:
  push:
    branches: [main, acme/agent-kit]

permissions:
  contents: read

jobs:
  boundaries:
    name: Boundaries (imports + dependency allowlist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency allowlist
        run: python tools/acme/check_boundaries.py
      - name: Import direction contract
        run: |
          pip install import-linter
          cd src && PYTHONPATH=. lint-imports --config ../.importlinter

  devops-signoff:
    # Gate 2, before merge. The acme-signoff environment requires a DevOps
    # reviewer, so this job waits until someone approves it with
    # "Review deployments". The ruleset makes this job a required status
    # check, so the PR cannot merge until DevOps signs off. A new push to
    # the PR starts a new run, so approval always applies to the latest commit.
    # Grok Bot's Release readiness skill links DevOps to the waiting run.
    name: DevOps sign-off (Gate 2)
    needs: boundaries
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: acme-signoff
    steps:
      - run: echo "DevOps signed off on ${{ github.event.pull_request.head.sha }}"

  release:
    # Mocked deploy after merge. No approval here: DevOps already signed off
    # on the PR. Direct pushes need an admin bypass of the branch ruleset,
    # which GitHub logs.
    name: Release (mocked)
    needs: boundaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: acme-release
    steps:
      - run: echo "MOCK DEPLOY - would publish wheel for ${GITHUB_SHA}"
